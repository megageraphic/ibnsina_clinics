            --dark-red: #B8000B;
            --primary-black: #111111;

            --border-color: #DCDFE4;
        }

            font-family: 'Cairo', sans-serif;
        }

            padding: 20px;
            color: var(--primary-black);
        }

            margin: 10px auto;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;

            border-bottom: 4px solid var(--primary-black);

            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #F0F0F0;
        }

        .logo-header img {
            max-width: 280px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
        }

        .badge-title {
            display: inline-block;
            background-color: #FFF0F1;

            font-size: 0.95rem;
            padding: 5px 18px;
            border-radius: 20px;
            border: 1px solid rgba(227, 6, 19, 0.2);

            margin-top: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-black);
        }

        .today-banner span {
            color: var(--primary-red);
            font-weight: 800;
        }

        h2 {
            text-align: center;
            color: var(--primary-black);
            font-size: 1.35rem;
            font-weight: 800;
            margin: 15px 0 25px 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .label-with-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .label-with-badge label {
            margin-bottom: 0;
        }

        .lock-badge-red {
            display: none;
            background-color: #E30613;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 999px;
            line-height: 1.5;
        }

        .lock-badge-red.visible {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary-black);
        }

        label span.req {
            color: var(--primary-red);
            margin-right: 3px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            background-color: #FAFAFA;
            color: var(--primary-black);
            transition: all 0.25s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            background-color: #FFFFFF;
            border-color: var(--primary-red);
            outline: none;
            box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.12);
        }

        select:disabled {
            background-color: #EFEFEF;
            color: #888;
            cursor: not-allowed;
        }

        .input-error {
            border-color: var(--primary-red) !important;
            background-color: #FFF5F5 !important;
        }

        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
        }

        .error-alert {
            background-color: #FFF0F1;
            color: var(--dark-red);
            border: 1px solid var(--primary-red);
        }

        .success-alert {
            background-color: #EDFDF3;
            color: #136F3A;
            border: 1px solid #28A745;
        }

        .row-split {
            display: flex;
            gap: 15px;
        }

        .row-split .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;
            font-size: 1.15rem;

        }

            </div>

            <div class="form-group">
                <label for="age">السن:<span class="req">*</span></label>
                <input type="number" id="age" name="age" min="1" max="120" required placeholder="مثال: 35">
            </div>
        </div>

        <div class="form-group">
            <label for="clinic">العيادة المطلوبة:<span class="req">*</span></label>
            <select id="clinic" name="clinic" required>
                <option value="" disabled selected>اختر العيادة...</option>
            </select>
        </div>

        <div class="row-split">
            <div class="form-group">
                <div class="label-with-badge">
                    <label for="doctor">الطبيب المتاح اليوم:<span class="req">*</span></label>
                    <span id="doctorLockBadge" class="lock-badge-red">🔒 قفل الحجز</span>
                </div>
                <select id="doctor" name="doctor" required disabled>
                    <option value="" disabled selected>اختر العيادة أولاً...</option>
                </select>
            </div>

            <div class="form-group">
                <div class="label-with-badge">
                    <label for="timeSlot">الموعد:<span class="req">*</span></label>
                    <span id="slotLockBadge" class="lock-badge-red">🔒 قفل الحجز</span>
                </div>
                <select id="timeSlot" name="timeSlot" required disabled>
                    <option value="" disabled selected>اختر الطبيب أولاً...</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="insurance">جهة التعاقد / التأمين الطبي :<span class="req">*</span></label>
            <select id="insurance" name="insurance" required>
                <option value="" disabled selected>اختر جهة التعاقد...</option>
                <option value="أهالي (نقدي)">أهالي (كشف نقدي)</option>
                <option value="جلوب ميد">جلوب ميد (Glob Med)</option>
                <option value=" ميدي كير"> ميدي كير (Med Care)</option>
                <option value="أليكو">أليكو (Alico)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">ملاحظات إضافية (اختياري):</label>
            <textarea id="notes" name="notes" rows="2" placeholder="أي تفاصيل إضافية تود توضيحها للكول سنتر..."></textarea>
        </div>

        <button type="submit" id="submitBtn">تأكيد وإرسال الحجز</button>
    </form>

    <div class="hospital-info">
        <strong>العنوان:</strong> العاشر من رمضان - المجاورة العاشرة – بجوار مستشفي ابن سينا - مول المنار الدور الاول علوي <br>
        <strong>للاستفسار والحجز المباشر:</strong> 01222243157 / 01222243156
    </div>

    <div class="live-datetime-bar" id="liveDateTimeBar">
        <span id="footerDay">...</span>
        <span>|</span>
        <span id="footerDate">...</span>
        <span>|</span>
        <span class="time-pill" id="footerTime">--:--:--</span>
    </div>

    <div class="footer-credit">

            <img src="100.png" alt="Mega Graphic">
            <span>تصميم وتطوير ميجا جيرافيك</span>

</div>

    let todayBookingsCountBySlot = {};
    const arabicDaysMap = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    const form = document.getElementById('bookingForm');
    const clinicSelect = document.getElementById('clinic');
    const dayInput = document.getElementById('day');
    const doctorSelect = document.getElementById('doctor');
    const timeSelect = document.getElementById('timeSlot');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    function getTodayArabicName() {
        return arabicDaysMap[new Date().getDay()];
    }

    function getActiveSchedule() {
        try {
            const raw = localStorage.getItem(STORAGE_SCHEDULE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
                    return parsed;
                }
            }
        } catch (e) {}
        return DEFAULT_CLINICS_SCHEDULE;
    }

    function isDoctorApologized(clinicName, docName, dayName = '') {
        try {
            const apologies = JSON.parse(localStorage.getItem(STORAGE_APOLOGIES_KEY) || '{}');
            const activeDay = dayName || dayInput.value || getTodayArabicName();
            return Boolean(
                apologies[`${clinicName}__${docName}`] ||
                (activeDay && apologies[`${clinicName}__${docName}__${activeDay}`])
            );
        } catch (e) {
            return false;
        }
    }

    function getDoctorSlotLimit(docName, clinicName = '', dayName = '') {
        const activeClinic = clinicName || clinicSelect.value || '';
        const activeDay = dayName || dayInput.value || getTodayArabicName();
        try {
            const custom = JSON.parse(localStorage.getItem(STORAGE_LIMITS_KEY) || '{}');
            const candidateKeys = [
                `${activeClinic}__${docName}__${activeDay}`,
                `${docName}__${activeDay}`,
                docName
            ];
            for (const key of candidateKeys) {
                if (Object.prototype.hasOwnProperty.call(custom, key)) {
                    const val = Number(custom[key]);
                    return val > 0 ? val : null;
                }
            }
        } catch (e) {}
        return DEFAULT_SLOT_LIMIT_DOCTORS[docName] ?? null;
    }

    function isSlotLockedToday(docName, timeSlot, clinicName = '', dayName = '') {
        const limit = getDoctorSlotLimit(docName, clinicName, dayName);
        if (!limit || !timeSlot) return false;
        const key = `${docName}__${timeSlot}`;
        const currentCount = todayBookingsCountBySlot[key] || 0;
        return currentCount >= limit;
    }

    function areAllDoctorSlotsLockedToday(clinicName, docName, dayName) {
        const schedule = getActiveSchedule();
        const limit = getDoctorSlotLimit(docName, clinicName, dayName);
        if (!limit) return false;
        const times = schedule[clinicName]?.[docName]?.[dayName] || [];
        if (times.length === 0) return false;
        return times.every(t => isSlotLockedToday(docName, t, clinicName, dayName));
    }

    function updateLockIndicators() {
        const selectedClinic = clinicSelect.value;
        const todayName = dayInput.value || getTodayArabicName();
        const docName = doctorSelect.value;
        const timeVal = timeSelect.value;

        const docBadge = document.getElementById('doctorLockBadge');
        const slotBadge = document.getElementById('slotLockBadge');

        if (docBadge) {
            if (selectedClinic && docName && areAllDoctorSlotsLockedToday(selectedClinic, docName, todayName)) {
                docBadge.textContent = '🔒 قفل الحجز';
                docBadge.classList.add('visible');
            } else {
                docBadge.classList.remove('visible');
            }
        }

        if (slotBadge) {
            if (docName && timeVal && isSlotLockedToday(docName, timeVal, selectedClinic, todayName)) {
                slotBadge.textContent = '🔒 قفل الحجز';
                slotBadge.classList.add('visible');
            } else {
                slotBadge.classList.remove('visible');
            }
        }
    }

        doctorSelect.disabled = true;
        timeSelect.disabled = true;
        updateLockIndicators();
    }

        placeholderOpt.disabled = true;
        placeholderOpt.selected = true;
        placeholderOpt.textContent = 'اختر العيادة...';
        clinicSelect.appendChild(placeholderOpt);

        let foundSelected = false;
        clinicNames.forEach(clinicName => {
            const opt = document.createElement('option');
            opt.value = clinicName;
            opt.textContent = clinicName;
            if (prevValue && prevValue === clinicName) {
                opt.selected = true;
                placeholderOpt.selected = false;
                foundSelected = true;
            }
            clinicSelect.appendChild(opt);
        });

        if (!foundSelected) {
            resetDoctorAndTime();
        }
    }

    function populateTimeSlotsForDoctor(docName, keepSelectedTime = '') {
        const schedule = getActiveSchedule();
        const selectedClinic = clinicSelect.value;
        const todayName = dayInput.value || getTodayArabicName();

        timeSelect.innerHTML = '<option value="" disabled selected>اختر الموعد...</option>';

        if (!docName || !selectedClinic || isDoctorApologized(selectedClinic, docName, todayName) || !schedule[selectedClinic]?.[docName]?.[todayName]) {
            timeSelect.disabled = true;
            updateLockIndicators();
            return;
        }

        const times = schedule[selectedClinic][docName][todayName];
        const allLocked = areAllDoctorSlotsLockedToday(selectedClinic, docName, todayName);

        if (allLocked) {
            timeSelect.innerHTML = '<option value="" disabled selected>مغلق لاكتمال الحجز اليوم</option>';
            timeSelect.disabled = true;
            updateLockIndicators();
            return;
        }

        timeSelect.disabled = false;
        times.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            const slotLocked = isSlotLockedToday(docName, t, selectedClinic, todayName);

            if (slotLocked) {
                opt.textContent = `${t} — 🔴 قفل الحجز`;
                opt.disabled = true;
            } else {
                opt.textContent = t;
            }

            if (keepSelectedTime && keepSelectedTime === t && !slotLocked) {
                opt.selected = true;
            }
            timeSelect.appendChild(opt);
        });

        updateLockIndicators();
    }

    function populateDoctorsForSelectedClinic(keepSelectedDoc = '', keepSelectedTime = '') {
        const schedule = getActiveSchedule();
        const selectedClinic = clinicSelect.value;
        const todayName = getTodayArabicName();
        dayInput.value = todayName;

        doctorSelect.innerHTML = '<option value="" disabled selected>اختر الطبيب...</option>';
        timeSelect.innerHTML = '<option value="" disabled selected>اختر الطبيب أولاً...</option>';
        timeSelect.disabled = true;

        if (!selectedClinic || !schedule[selectedClinic]) {
            doctorSelect.disabled = true;
            updateLockIndicators();
            return;
        }

        const doctorsInClinic = schedule[selectedClinic];
        const availableDoctors = Object.keys(doctorsInClinic).filter(docName => {
            return Array.isArray(doctorsInClinic[docName]?.[todayName]) && doctorsInClinic[docName][todayName].length > 0;
        });

        if (availableDoctors.length > 0) {
            doctorSelect.disabled = false;
            let matchedDoc = '';

            availableDoctors.forEach(doc => {
                const opt = document.createElement('option');
                opt.value = doc;
                const apologized = isDoctorApologized(selectedClinic, doc, todayName);
                const allSlotsLocked = areAllDoctorSlotsLockedToday(selectedClinic, doc, todayName);

                if (apologized) {
                    opt.textContent = `${doc} — 🚫 معتذر عن الحضور اليوم`;
                    opt.disabled = true;
                } else if (allSlotsLocked) {
                    opt.textContent = `${doc} — 🔴 قفل الحجز`;
                    opt.disabled = true;
                } else {
                    opt.textContent = doc;
                }

                if (keepSelectedDoc && keepSelectedDoc === doc && !apologized && !allSlotsLocked) {
                    opt.selected = true;
                    matchedDoc = doc;
                }

                doctorSelect.appendChild(opt);
            });

            if (matchedDoc) {
                populateTimeSlotsForDoctor(matchedDoc, keepSelectedTime);
            }
        } else {
            doctorSelect.disabled = true;
            doctorSelect.innerHTML = `<option value="" disabled selected>لا توجد عيادات متاحة اليوم (${todayName})</option>`;
        }

        updateLockIndicators();
    }

    function applyLatestScheduleToUI() {
        const prevClinic = clinicSelect.value;
        const prevDoc = doctorSelect.value;
        const prevTime = timeSelect.value;

        syncClinicSelectOptions(prevClinic);

        if (clinicSelect.value) {
            populateDoctorsForSelectedClinic(prevDoc, prevTime);
        } else {
            resetDoctorAndTime();
        }
        updateLockIndicators();
    }

    async function syncSettingsFromSupabase() {
        try {
            const { data, error } = await supabaseClient
                .from('clinic_settings')
                .select('schedule_json, limits_json, apologies_json')
                .eq('id', 'main_schedule_config')
                .maybeSingle();

            if (!error && data && data.schedule_json) {
                localStorage.setItem(STORAGE_SCHEDULE_KEY, JSON.stringify(data.schedule_json));
                localStorage.setItem(STORAGE_LIMITS_KEY, JSON.stringify(data.limits_json || {}));
                localStorage.setItem(STORAGE_APOLOGIES_KEY, JSON.stringify(data.apologies_json || {}));
            }
        } catch (e) {}

        applyLatestScheduleToUI();
    }

    async function refreshTodaySlotCounts() {
        const todayName = getTodayArabicName();
        const { data, error } = await supabaseClient
            .from('clinic_bookings')
            .select('doctor_name, appointment_time, status')
            .eq('appointment_day', todayName);

        if (error) {
            console.warn('Could not refresh today slot counts:', error.message);
            return;
        }

        const counts = {};
        (data || []).forEach(row => {
            if (row.status === 'ملغي') return;
            const doc = row.doctor_name;
            const slot = row.appointment_time;
            if (!doc || !slot) return;
            const key = `${doc}__${slot}`;
            counts[key] = (counts[key] || 0) + 1;
        });

        todayBookingsCountBySlot = counts;
        applyLatestScheduleToUI();
    }

    function updateLiveClock() {
        const now = new Date();
        const todayName = arabicDaysMap[now.getDay()];

        const dateStr = now.toLocaleDateString('ar-EG', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        const timeStr = now.toLocaleTimeString('ar-EG', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
        });

        document.getElementById('currentDayLabel').textContent = todayName;
        document.getElementById('day').value = todayName;
        document.getElementById('footerDay').textContent = 'اليوم: ' + todayName;
        document.getElementById('footerDate').textContent = dateStr;
        document.getElementById('footerTime').textContent = timeStr;
    }

    updateLiveClock();
    setInterval(updateLiveClock, 1000);

    clinicSelect.addEventListener('change', function() {
        populateDoctorsForSelectedClinic('', '');
    });

    doctorSelect.addEventListener('change', function() {
        const selectedDoctor = this.value;
        errorBox.style.display = 'none';
        populateTimeSlotsForDoctor(selectedDoctor, '');
    });

    timeSelect.addEventListener('change', function() {
        const selectedDoctor = doctorSelect.value;
        const selectedSlot = this.value;
        updateLockIndicators();

        if (isSlotLockedToday(selectedDoctor, selectedSlot, clinicSelect.value, dayInput.value)) {
            errorBox.textContent = `عذراً، تم قفل الحجز على موعد (${selectedSlot}) للطبيب ${selectedDoctor}.`;
            errorBox.style.display = 'block';
        } else {
            errorBox.style.display = 'none';
        }
    });

    window.addEventListener('storage', function(event) {
        if (
            event.key === STORAGE_SCHEDULE_KEY ||
            event.key === STORAGE_LIMITS_KEY ||
            event.key === STORAGE_APOLOGIES_KEY
        ) {
            applyLatestScheduleToUI();
            refreshTodaySlotCounts();
        }
    });

    supabaseClient
        .channel('ibn_sina_schedule_sync')
        .on('broadcast', { event: 'schedule_updated' }, (payload) => {
            if (payload?.payload?.schedule) {
                localStorage.setItem(STORAGE_SCHEDULE_KEY, JSON.stringify(payload.payload.schedule));
                localStorage.setItem(STORAGE_LIMITS_KEY, JSON.stringify(payload.payload.limits || {}));
                localStorage.setItem(STORAGE_APOLOGIES_KEY, JSON.stringify(payload.payload.apologies || {}));
            }
            applyLatestScheduleToUI();
            refreshTodaySlotCounts();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'clinic_settings' }, () => {
            syncSettingsFromSupabase();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'clinic_bookings' }, () => {
            refreshTodaySlotCounts();
        })
        .subscribe();

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        let isValid = true;
        let errorMessage = '';

        const fullName = document.getElementById('fullName');
        const phone = document.getElementById('phone');
        const age = document.getElementById('age');
        const insurance = document.getElementById('insurance');
        const notes = document.getElementById('notes');
        const todayName = dayInput.value || getTodayArabicName();

        const requiredFields = [fullName, phone, age, clinicSelect, doctorSelect, timeSelect, insurance];
        requiredFields.forEach(el => el.classList.remove('input-error'));
        errorBox.style.display = 'none';
        successBox.style.display = 'none';

        if (fullName.value.trim().length < 3) {
            isValid = false;
            fullName.classList.add('input-error');
            errorMessage = 'يرجى إدخال اسم المريض بالكامل بشكل صحيح.';
        } else if (!/^01[0125][0-9]{8}$/.test(phone.value.trim())) {
            isValid = false;
            phone.classList.add('input-error');
            errorMessage = 'يرجى إدخال رقم موبايل صحيح مكون من 11 رقم (يبدأ بـ 01).';
        } else if (age.value.trim() === '' || Number(age.value) < 1 || Number(age.value) > 120) {
            isValid = false;
            age.classList.add('input-error');
            errorMessage = 'يرجى إدخال السن بشكل صحيح.';
        } else if (clinicSelect.value === '') {
            isValid = false;
            clinicSelect.classList.add('input-error');
            errorMessage = 'يرجى اختيار العيادة المطلوبة.';
        } else if (doctorSelect.value === '') {
            isValid = false;
            doctorSelect.classList.add('input-error');
            errorMessage = `يرجى اختيار الطبيب المتاح اليوم (${todayName}).`;
        } else if (isDoctorApologized(clinicSelect.value, doctorSelect.value, todayName)) {
            isValid = false;
            doctorSelect.classList.add('input-error');
            errorMessage = `عذراً، الطبيب ${doctorSelect.value} معتذر عن الحضور اليوم.`;
        } else if (timeSelect.value === '') {
            isValid = false;
            timeSelect.classList.add('input-error');
            errorMessage = 'يرجى اختيار موعد الكشف.';
        } else if (isSlotLockedToday(doctorSelect.value, timeSelect.value, clinicSelect.value, todayName)) {
            isValid = false;
            timeSelect.classList.add('input-error');
            updateLockIndicators();
            errorMessage = `تم قفل الحجز على موعد (${timeSelect.value}) للطبيب ${doctorSelect.value}.`;
        } else if (insurance.value === '') {
            isValid = false;
            insurance.classList.add('input-error');
            errorMessage = 'يرجى اختيار جهة التعاقد أو التأمين.';
        }

        if (!isValid) {
            errorBox.textContent = errorMessage;
            errorBox.style.display = 'block';
            errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        submitBtn.disabled = true;
        const originalBtnText = submitBtn.textContent;
        submitBtn.textContent = 'جاري تسجيل الحجز...';

        await syncSettingsFromSupabase();
        await refreshTodaySlotCounts();

        if (isDoctorApologized(clinicSelect.value, doctorSelect.value, todayName)) {
            submitBtn.disabled = false;
            submitBtn.textContent = originalBtnText;
            errorBox.textContent = `عذراً، الطبيب ${doctorSelect.value} معتذر عن الحضور اليوم.`;
            errorBox.style.display = 'block';
            errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }
        if (isSlotLockedToday(doctorSelect.value, timeSelect.value, clinicSelect.value, todayName)) {
            submitBtn.disabled = false;
            submitBtn.textContent = originalBtnText;
            errorBox.textContent = `تم قفل الحجز على موعد (${timeSelect.value}) للطبيب ${doctorSelect.value}.`;
            errorBox.style.display = 'block';
            errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        const payload = {
            patient_name: fullName.value.trim(),
            phone: phone.value.trim(),
            age: Number(age.value.trim()),
            clinic: clinicSelect.value,
            appointment_day: todayName,
            doctor_name: doctorSelect.value,
            appointment_time: timeSelect.value,
            insurance_type: insurance.value,
            notes: notes.value.trim() || 'لا توجد ملاحظات'
        };

        const { error } = await supabaseClient
            .from('clinic_bookings')
            .insert([payload]);

        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnText;

        if (error) {
            console.error('Supabase Error:', error);
            errorBox.textContent = 'تعذر حفظ الحجز في قاعدة البيانات، يرجى المحاولة مرة أخرى.';
            errorBox.style.display = 'block';
            errorBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        successBox.textContent = `تم تسجيل حجزك ليوم ${todayName} بنجاح، وسيتواصل معك فريق الاستقبال لتأكيد الموعد.`;
        successBox.style.display = 'block';
        successBox.scrollIntoView({ behavior: 'smooth', block: 'center' });

        form.reset();
        dayInput.value = getTodayArabicName();
        syncClinicSelectOptions('');
        resetDoctorAndTime();
        await refreshTodaySlotCounts();
    });

    (async function initPage() {
        syncClinicSelectOptions('');
        await syncSettingsFromSupabase();
        await refreshTodaySlotCounts();
    })();
</script>
